name: CI

on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:

jobs:
  # Scaffolding step-5 gate (api-freeze-v1 §6): the same scripted scenario run twice must
  # produce a byte-identical per-channel CRC stream and deep dump. The matrix varies the GC
  # and JIT-tiering configuration so run-to-run nondeterminism from the runtime itself would
  # surface here first (the OPEN-10 rolling CI job).
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime-config:
        - name: workstation-gc-tiered
          gcServer: '0'
          tieredCompilation: '1'
        - name: server-gc-fulljit
          gcServer: '1'
          tieredCompilation: '0'

    runs-on: ${{ matrix.os }}

    env:
      DOTNET_gcServer: ${{ matrix.runtime-config.gcServer }}
      DOTNET_TieredCompilation: ${{ matrix.runtime-config.tieredCompilation }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x'

    - name: Run-twice determinism suite
      run: dotnet test src/OpenSage.SimCore.Tests --configuration Release --filter Category=Determinism

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
        - os: windows-latest
          runtime: win-x64
        - os: macos-latest
          runtime: osx-arm64
        - os: ubuntu-latest
          runtime: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x'

    - name: Test
      run: dotnet test src --configuration Release --filter Category!=Interactive --collect:"XPlat Code Coverage"

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Publish
      run: dotnet publish src/OpenSage.Launcher --configuration Release --runtime ${{ matrix.runtime }} --self-contained --output build/artifacts/${{ matrix.runtime }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.runtime }}
        path: build/artifacts/${{ matrix.runtime }}

  publish:
    needs: build

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    runs-on: windows-latest

    steps:
    - name: Download Artifacts win-x64
      uses: actions/download-artifact@v7
      with:
        name: win-x64

    - name: Download Artifacts osx-arm64
      uses: actions/download-artifact@v7
      with:
        name: osx-arm64

    - name: Download Artifacts linux-x64
      uses: actions/download-artifact@v7
      with:
        name: linux-x64

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: ${{ github.ref }}
        body: "## Instructions\n1. Download the correct .zip file for your operating system\n2. Linux/Mac: export the path to your game path as an environment variable e.g.: `export CNC_GENERALS_PATH=~/generals/`\n3. Start the `OpenSage.Launcher` executable\n\n## Launcher\nThis executable will start OpenSAGE with the C&C Generals game files. To specify a different SAGE game, or see what other command line options are available, run `OpenSage.Launcher.exe --help`."
        draft: false
        prerelease: true

    # TODO: Upload Release Assets
    # using actions/upload-a-release-asset
