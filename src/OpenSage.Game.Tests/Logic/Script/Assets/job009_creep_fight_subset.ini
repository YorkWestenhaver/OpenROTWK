; job009_creep_fight harness subset - the REAL AotR combat chain for the two hordes the
; map spawns, trimmed to what the headless module pipeline runs today. Every number that
; feeds combat (health, damage, range, timing, speed, armor scalars, formation slots) is
; copied verbatim from the AotR 8.0 sources listed below; macros used by those blocks are
; inlined as #defines with their gamedata.ini values.
;
; Sources:
;   object/goodfaction/hordes/men/anorienfighter.ini      (GondorFighterHorde)
;   object/goodfaction/units/men/gondorfighter.ini        (GondorFighter)
;   object/evilfaction/hordes/mordor/mordorfighterhorde.ini (MordorFighterHorde)
;   object/evilfaction/units/mordor/mordorfighter.ini     (MordorFighter/1/2)
;   weapon.ini, armor.ini, locomotor.ini, gamedata.ini
;
; Trims (everything omitted relative to the retail blocks, and why):
;   * Draw/ClientBehavior/audio (Voice*, Sound*, EvaEvents, CrowdResponseKey,
;     UnitSpecificSounds, LargeGroupAudioUpdate) - presentation only, headless.
;   * FireFX/FireFlankFX/BurningDeath*/DamageFX lines - FX asset references the harness
;     does not load.
;   * Upgrade/special-power modules (LevelUpUpgrade, StatusBitsUpgrade, WeaponSetUpgrade,
;     ArmorUpgrade, SubObjectsUpgrade, AttributeModifierUpgrade, SpecialPowerModule,
;     SpecialAbilityUpdate, UnpauseSpecialPowerUpgrade, AISpecialPowerUpdate,
;     ObjectCreationUpgrade, SiegeDeployHordeSpecialPower, CaptureBuilding.inc) - no
;     upgrades/powers are exercised by the creep fight; several are [ParseOnly].
;   * AI/behavior modules that are [ParseOnly] in the fork (StancesBehavior, HordeAIUpdate,
;     AIUpdateInterface, EmotionTrackerUpdate, PickupStuffUpdate, LargeGroupBonusUpdate,
;     BloodthirstyUpdate, CommandButtonHuntUpdate, ProductionUpdate, PhysicsBehavior,
;     SquishCollide, HordeMemberCollide, SlowDeathBehavior, BezierProjectileBehavior) -
;     creating them throws ModuleNotPortedException; track B ports the combat-relevant
;     ones. Member separation (HordeMemberCollide) and death FX are therefore absent;
;     members die instantly (no SlowDeathBehavior sink/decay).
;   * The authored LocomotorSet Speed overrides (NORMAL_FOOT_MED_HORDE_SPEED=50,
;     NORMAL_FOOT_MED_MEMBER_SPEED=55) are folded into the Locomotor blocks as Speed
;     fields: SimLocomotorUpdate reads speed from the locomotor template only and does
;     not yet apply the LocomotorSetTemplate.Speed override (S2 gap, noted in the track
;     report). The values are the exact authored set speeds.
;   * The horde/member module vocabulary is the fork's S6/S2 interim registration:
;     HordeContain -> SimHordeContain (same fields), LocomotorSet blocks kept as authored,
;     members additionally declare SimLocomotorUpdate + SimHordeMember (the retail engine
;     wires these implicitly through AIUpdate/HordeContain; the fork registers them as
;     explicit behaviors - LOCO-F1 shape).
;   * Banner carriers (BannerCarriersAllowed/BannerCarrierPosition, GondorInfantryBanner,
;     MordorBannerOrcNewSmall) - retail spawns no banner at level 1 (the level-up purchase
;     path is unported); trimming them reproduces the oracle's 15/20 member rosters.
;   * SET_SCARED / SET_BURNINGDEATH locomotor sets (ScaredMeleeHordeLocomotor,
;     BurningDeathLocomotorInfantry) - fear/burning states never trigger in this scenario.
;   * AlternateFormation/ComboHorde/SplitHorde, AutoResolve*/WorldMap*, CommandSet,
;     SelectPortrait/ButtonImage/DisplayName*, ThreatBreakdown, TransportSlotCount,
;     CrushableLevel/Crusher*/Crush* fields and crush weapons (GuardianCrush,
;     BasicInfantryCrushRevenge - no cavalry in this fight), vision/shroud fields,
;     BuildCost/BuildTime/CommandPoints/BountyValue - metadata unused headless.
;   * GondorFighter WeaponSet/ArmorSet PLAYER_UPGRADE variants (AnorienSwordUpgraded,
;     SoldierEliteHeavyArmor, MordorHeavyArmor) - unreachable without the upgrade system.
;   * KindOf trimmed of flags whose systems are unported (ATTACK_NEEDS_LINE_OF_SIGHT,
;     NOTIFY_OF_PREATTACK, ARMY_SUMMARY, LARGE_RECTANGLE_PATHFIND, PRELOAD, SCORE,
;     THROWN_OBJECT, GRAB_AND_DROP, CAN_CAST_REFLECTIONS, CAN_USE_SIEGE_TOWER,
;     PATH_THROUGH_EACH_OTHER, MELEE_HORDE, ORC, SELECTABLE) - the retained flags
;     (INFANTRY, HORDE, CAN_ATTACK) are the ones the ported code paths read.

; ---- gamedata.ini macros (values verbatim) ----
#define STANDARD_MELEE_ATTACK_RANGE 11.5
#define ANGMAR_SWORD_DELAYBETWEENSHOTS 1200
#define GONDOR_SOLDIER_SWORD_PREATTACKDELAY 500
#define GONDOR_SOLDIER_SWORD_FIRINGDURATION 1000
#define MORDOR_FIGHTER_PREATTACKDELAY 633
#define MORDOR_FIGHTER_HEALTH 75
#define GOOD_MEN_GIANT_HORDE_SIZE 15
#define NORMAL_FOOT_MED_HORDE_SPEED 50
#define NORMAL_FOOT_MED_MEMBER_SPEED 55

; ---- weapon.ini ----

Weapon NormalMeleeHordeRangefinder
	AttackRange			= 12.0
	DelayBetweenShots	= 1000
	AcceptableAimDelta	= 45
	MeleeWeapon			= Yes
	FinishAttackOnceStarted = No
	HordeAttackNugget
	End
End

Weapon AnorienSword
  LeechRangeWeapon      = Yes
  AttackRange           = STANDARD_MELEE_ATTACK_RANGE
  MeleeWeapon           = Yes
  DelayBetweenShots     = ANGMAR_SWORD_DELAYBETWEENSHOTS
  PreAttackDelay        = GONDOR_SOLDIER_SWORD_PREATTACKDELAY
  PreAttackType         = PER_SHOT
  FiringDuration        = GONDOR_SOLDIER_SWORD_FIRINGDURATION
  DamageNugget
    Damage        = 80
    Radius        = 0.0
    DelayTime     = 0
    DamageType    = SLASH
    DamageFXType  = SWORD_SLASH
    DeathType     = NORMAL
    FlankingBonus = 50%
  End
End

Weapon MordorWarriorAxe
  LeechRangeWeapon      = Yes
  AttackRange           = STANDARD_MELEE_ATTACK_RANGE
  MeleeWeapon           = Yes
  DelayBetweenShots     = 1000
  PreAttackDelay        = MORDOR_FIGHTER_PREATTACKDELAY
  PreAttackType         = PER_SHOT
  FiringDuration        = 1000
  DamageNugget
    Damage        = 20
    Radius        = 0.0
    DelayTime     = 0
    DamageType    = SLASH
    DamageFXType  = SWORD_SLASH
    DeathType     = NORMAL
    FlankingBonus = 50%
  End
End

