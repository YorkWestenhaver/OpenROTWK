; ---- members ----

Object GondorFighter
	Side = Men
	EditorSorting = UNIT
	KindOf = INFANTRY

	WeaponSet
		Conditions		= None
		Weapon			= PRIMARY    AnorienSword
		AutoChooseSources	= PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	ArmorSet
		Conditions      = None
		Armor           = SoldierEliteArmor
	End

	Body = ActiveBody ModuleTag_02
		MaxHealth         = 330
	End

	Behavior = SimLocomotorUpdate ModuleTag_Loco
	End
	Behavior = SimHordeMember ModuleTag_HordeMember
	End

	LocomotorSet
		Locomotor = HumanSpecialChargeLocomotor
		Condition = SET_NORMAL
		Speed     = NORMAL_FOOT_MED_MEMBER_SPEED
	End

	Geometry = CYLINDER
	GeometryMajorRadius = 8.0
	GeometryMinorRadius = 8.0
	GeometryHeight = 19.2
	GeometryIsSmall = Yes
End

Object MordorFighter
	Side = Mordor
	EditorSorting = UNIT
	BuildVariations = MordorFighter1 MordorFighter2
	KindOf = INFANTRY
End

Object MordorFighter1
	Side = Mordor
	EditorSorting = UNIT
	KindOf = INFANTRY

	WeaponSet
		Conditions = None
		Weapon = PRIMARY    MordorWarriorAxe
		AutoChooseSources = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
	End
	ArmorSet
		Conditions      = None
		Armor           = MordorOrcArmor
	End

	Body = ActiveBody ModuleTag_02
		MaxHealth         = MORDOR_FIGHTER_HEALTH
	End

	Behavior = SimLocomotorUpdate ModuleTag_Loco
	End
	Behavior = SimHordeMember ModuleTag_HordeMember
	End

	LocomotorSet
		Locomotor     = HumanLocomotor
		Condition     = SET_NORMAL
		Speed         = NORMAL_FOOT_MED_MEMBER_SPEED
	End

	Geometry = CYLINDER
	GeometryMajorRadius = 8
	GeometryMinorRadius = 8
	GeometryHeight = 19.2
	GeometryIsSmall = No
End

; Retail MordorFighter2 is an art-only reskin of MordorFighter1 (EquivalentTo); with Draw
; trimmed the child adds nothing but must exist for BuildVariations to resolve.
ChildObject MordorFighter2 MordorFighter1
End

; ---- horde containers ----

