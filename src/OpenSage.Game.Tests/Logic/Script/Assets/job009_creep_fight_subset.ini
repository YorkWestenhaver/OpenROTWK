	Surfaces			= GROUND RUBBLE
	TurnTime			= 2000
	TurnTimeDamaged		= 2000
	FastTurnRadius		= 33
	SlowTurnRadius		= 33
	FormationPriority	= MELEE1
	WaitForFormation	= Yes
